# Nome do workflow, aparece na "Actions"
name: Pipeline CI/CD
# Definir quando o pipeline será disparado
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/**"
  workflow_dispatch: # habilitar o botão "Run workflow" no Github Actions

jobs:
  # Primeiro job: build
  build:
    runs-on: ubuntu-latest # Imagem da maquina usada no CI

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalação das dependências
        run: npm install

      - name: Rodar o build
        run: npm run build
        env:
          TMDB_API_URL: ${{ vars.TMDB_API_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEXT_PUBLIC_TMDB_API_IMG_URL: ${{ vars.NEXT_PUBLIC_TMDB_API_IMG_URL }}

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalação das dependências
        run: npm install

      - name: Rodando lint
        run: npm run lint
        
     
      - name: Verificando formatacao
        run: npx prettier --write .

      - name: Rodando tests
        run: npm run test -- --watchAll=false
