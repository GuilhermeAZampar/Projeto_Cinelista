# Nome do workflow, aparece na "Actions"
name: Pipeline CI/CD
# Definir quando o pipeline será disparado
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/**"
  workflow_dispatch: # habilitar o botão "Run workflow" no Github Actions

jobs:
  # Primeiro job: build
  build:
    runs-on: ubuntu-latest # Imagem da maquina usada no CI

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalação das dependências
        run: npm install

      - name: Rodar o build
        run: npm run build
        env:
          TMDB_API_URL: ${{ vars.TMDB_API_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEXT_PUBLIC_TMDB_API_IMG_URL: ${{ vars.NEXT_PUBLIC_TMDB_API_IMG_URL }}

  # Segundo job: test
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalação das dependências
        run: npm install

      - name: Rodando lint
        run: npm run lint
        
      - name: Verificando formatacao
        run: npx prettier --write .

      - name: Rodando tests
        run: npx jest --watchAll=false --passWithNoTests

  # Terceiro job: deploy
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalação Vercel CLI
        run: npm install -g vercel@latest

      - name: Deply para vercel
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
